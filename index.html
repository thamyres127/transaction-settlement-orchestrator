<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Settlement Orchestrator</title>
</head>
<body style="margin: 0; background-color: #F9F8F6; font-family: Arial, sans-serif;">
    <div style="padding: 20px; min-height: 100vh;">
        <div style="text-align: center; margin-bottom: 30px;">
            <h2 style="margin: 0; color: #2C2A29;">Transaction Settlement Orchestrator</h2>
            <p style="color: #8C8275; margin: 5px 0 0 0;">Painel de Risco e Liquidação</p>
        </div>

        <div style="display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; margin-bottom: 30px;">
            <div style="background: #FFF; border: 1px solid #E6E1DA; border-radius: 8px; padding: 20px; min-width: 200px; text-align: center;">
                <h4 style="color: #8C8275; margin: 0;">Faturamento</h4>
                <h2 id="faturamento-total" style="color: #4A5D4E; margin: 10px 0 0 0;">R$ 0.00</h2>
            </div>
            <div style="background: #FFF; border: 1px solid #E6E1DA; border-radius: 8px; padding: 20px; min-width: 200px; text-align: center;">
                <h4 style="color: #8C8275; margin: 0;">Aprovadas</h4>
                <h2 id="transacoes-aprovadas" style="color: #6B8E23; margin: 10px 0 0 0;">0</h2>
            </div>
            <div style="background: #FFF; border: 1px solid #E6E1DA; border-radius: 8px; padding: 20px; min-width: 200px; text-align: center;">
                <h4 style="color: #8C8275; margin: 0;">Fraudes</h4>
                <h2 id="fraudes-bloqueadas" style="color: #CD5C5C; margin: 10px 0 0 0;">0</h2>
            </div>
        </div>

        <div style="display: flex; flex-wrap: wrap; gap: 20px; justify-content: center;">
            <div style="background: #FFF; border: 1px solid #E6E1DA; border-radius: 8px; padding: 20px; width: 100%; max-width: 450px; box-sizing: border-box;">
                <form id="meuForm">
                    <label><b>CPF:</b></label>
                    <input type="text" id="cpfInput" style="width:100%; padding:10px; margin:5px 0 15px 0;" required />
                    <label><b>Valor:</b></label>
                    <input type="number" step="0.01" id="valorInput" style="width:100%; padding:10px; margin:5px 0 15px 0;" required />
                    <label><b>Canal:</b></label>
                    <select id="tipoInput" style="width:100%; padding:10px; margin:5px 0 15px 0;">
                        <option value="PIX">PIX</option>
                        <option value="TED">TED</option>
                    </select>
                    <button type="submit" style="width:100%; padding:12px; background:#4A5D4E; color:#FFF; border:none; border-radius:4px; font-weight:bold;">Disparar Liquidação</button>
                </form>
            </div>
            <div style="background: #FFF; border: 1px solid #E6E1DA; border-radius: 8px; padding: 20px; width: 100%; max-width: 450px; box-sizing: border-box;">
                <h3>Logs</h3>
                <div id="container-logs"><p id="log-vazio">Nenhuma transação.</p></div>
            </div>
        </div>
    </div>
    <script>
        let fat = 0.0; let apr = 0; let frd = 0; let hist = [];
        document.getElementById('meuForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const cpf = document.getElementById('cpfInput').value.trim();
            const val = parseFloat(document.getElementById('valorInput').value);
            const tipo = document.getElementById('tipoInput').value;
            const ts = Date.now() / 1000;
            const cLogs = document.getElementById('container-logs');
            if (document.getElementById('log-vazio')) document.getElementById('log-vazio').style.display = 'none';
            function addL(st, mot) {
                const box = document.createElement('div');
                box.style.padding = '10px'; box.style.margin = '5px 0'; box.style.borderLeft = '5px solid ' + (st === 'APROVADA' ? '#6B8E23' : '#CD5C5C'); box.style.background = '#FAFAFA';
                box.innerHTML = `<b>[${st}]</b><br><small>CPF: ${cpf} | R$ ${val.toFixed(2)} | ${tipo}<br>Motivo: ${mot}</small>`;
                cLogs.insertBefore(box, cLogs.firstChild);
            }
            if (val > 10000) { addL('REJEITADA', 'Excede limite operacional'); frd++; document.getElementById('fraudes-bloqueadas').innerText = frd; return; }
            if (hist.find(l => l.cpf === cpf && l.val === val && (ts - l.ts) < 60)) { addL('REJEITADA', 'Repetição rápida suspeita'); frd++; document.getElementById('fraudes-bloqueadas').innerText = frd; return; }
            const h = new Date().getHours();
            if ((h >= 22 || h < 6) && val > 1000) { addL('REJEITADA', 'Limite noturno excedido'); frd++; document.getElementById('fraudes-bloqueadas').innerText = frd; return; }
            hist.unshift({ cpf, val, ts }); apr++; fat += val;
            document.getElementById('transacoes-aprovadas').innerText = apr;
            document.getElementById('faturamento-total').innerText = 'R$ ' + fat.toFixed(2);
            addL('APROVADA', 'Liquidação concluída');
            document.getElementById('cpfInput').value = ''; document.getElementById('valorInput').value = '';
        });
    </script>
</body>
</html>
