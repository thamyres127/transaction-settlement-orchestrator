<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction Settlement Orchestrator</title>
    <!-- Carregando as bibliotecas do React e Babel via CDN de forma leve -->
    <script src="https://unpkg.com" crossorigin></script>
    <script src="https://unpkg.com" crossorigin></script>
    <script src="https://unpkg.com"></script>
</head>
<body style="margin: 0; background-color: #F9F8F6;">

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function App() {
            // ==========================================
            // 1. ESTADOS DO SISTEMA (DADOS EM MEMÓRIA)
            // ==========================================
            const [cpf, setCpf] = useState('');
            const [valor, setValor] = useState('');
            const [tipo, setTipo] = useState('PIX');
            
            const [faturamentoTotal, setFaturamentoTotal] = useState(0.0);
            const [transacoesAprovadas, setTransacoesAprovadas] = useState(0);
            const [fraudesBloqueadas, setFraudesBloqueadas] = useState(0);
            
            const [logs, setLogs] = useState([]);

            // ==========================================
            // 2. LÓGICA DO MOTOR DE RISCO INTEGRADO
            // ==========================================
            const dispararTransacao = (e) => {
                e.preventDefault();

                const novaTransacao = {
                    cpf: cpf.trim(),
                    valor: parseFloat(valor),
                    tipo: tipo,
                    timestamp: Date.now() / 1000
                };

                // Validação de campos nulos ou inconsistentes [explicit_memory_claims]
                if (!novaTransacao.cpf || isNaN(novaTransacao.valor) || novaTransacao.valor <= 0) {
                    const erroDados = {
                        id: `ERR-${Date.now()}`,
                        status: 'REJEITADA',
                        motivo: 'Dados inconsistentes ou nulos',
                        ...novaTransacao
                    };
                    setLogs(prev => [erroDados, ...prev]);
                    setFraudesBloqueadas(prev => prev + 1);
                    return;
                }

                // REGRA 1: Limite Operacional por Transação [explicit_memory_claims]
                if (novaTransacao.valor > 10000.00) {
                    const erroRegra1 = {
                        id: `ERR-${Date.now()}`,
                        status: 'REJEITADA',
                        motivo: 'Transação excede o limite operacional de segurança',
                        ...novaTransacao
                    };
                    setLogs(prev => [erroRegra1, ...prev]);
                    setFraudesBloqueadas(prev => prev + 1);
                    return;
                }

                // REGRA 2: Bloqueio de Repetição Rápida (Anti-Spam de 60 segundos) [explicit_memory_claims]
                const tentativaDuplicada = logs.find(log => 
                    log.cpf === novaTransacao.cpf && 
                    log.valor === novaTransacao.valor && 
                    (novaTransacao.timestamp - log.timestamp) < 60
                );
                if (tentativaDuplicada) {
                    const erroRegra2 = {
                        id: `ERR-${Date.now()}`,
                        status: 'REJEITADA',
                        motivo: 'Transação bloqueada por repetição rápida suspeita',
                        ...novaTransacao
                    };
                    setLogs(prev => [erroRegra2, ...prev]);
                    setFraudesBloqueadas(prev => prev + 1);
                    return;
                }

                // REGRA 3: Trava de Horário Noturno (Entre 22h e 06h acima de R$ 1000) [explicit_memory_claims]
                const horaAtual = new Date().getHours();
                if ((horaAtual >= 22 || horaAtual < 6) && novaTransacao.valor > 1000.00) {
                    const erroRegra3 = {
                        id: `ERR-${Date.now()}`,
                        status: 'REJEITADA',
                        motivo: 'Limite noturno excedido para o horário (Máx: R$ 1000.00)',
                        ...novaTransacao
                    };
                    setLogs(prev => [erroRegra3, ...prev]);
                    setFraudesBloqueadas(prev => prev + 1);
                    return;
                }

                // LIQUIDAÇÃO CONCLUÍDA COM SUCESSO [explicit_memory_claims]
                const sucessoTransacao = {
                    id: `TX-${Math.floor(novaTransacao.timestamp)}-${novaTransacao.cpf.substring(0, 3)}`,
                    status: 'APROVADA',
                    motivo: 'Liquidação realizada com sucesso e saldo conciliado',
                    ...novaTransacao
                };

                setLogs(prev => [sucessoTransacao, ...prev]);
                setTransacoesAprovadas(prev => prev + 1);
                setFaturamentoTotal(prev => prev + novaTransacao.valor);

                setCpf('');
                setValor('');
            };

            // ==========================================
            // 3. INTERFACE VISUAL (PALETA DE CORES NEUTRA) [explicit_memory_claims]
            // ==========================================
            const estilos = {
                container: { fontFamily: 'Arial, sans-serif', backgroundColor: '#F9F8F6', color: '#4A4A4A', padding: '20px', minHeight: '100vh' },
                header: { textAlign: 'center', marginBottom: '30px', color: '#2C2A29' },
                grid: { display: 'flex', flexWrap: 'wrap', gap: '20px', justifyContent: 'center' },
                cardMetric: { backgroundColor: '#FFFFFF', border: '1px solid #E6E1DA', borderRadius: '8px', padding: '20px', minWidth: '220px', textAlign: 'center', boxShadow: '0 2px 4px rgba(0,0,0,0.02)' },
                secao: { backgroundColor: '#FFFFFF', border: '1px solid #E6E1DA', borderRadius: '8px', padding: '20px', width: '100%', maxWidth: '500px', boxShadow: '0 2px 4px rgba(0,0,0,0.02)', boxSizing: 'border-box' },
                input: { width: '100%', padding: '10px', margin: '10px 0', border: '1px solid #D1C9BD', borderRadius: '4px', boxSizing: 'border-box', backgroundColor: '#FAFAFA' },
                botao: { width: '100%', padding: '12px', backgroundColor: '#4A5D4E', color: '#FFFFFF', border: 'none', borderRadius: '4px', fontWeight: 'bold', cursor: 'pointer', marginTop: '10px' },
                logItem: (status) => ({ padding: '12px', borderBottom: '1px solid #E6E1DA', borderLeft: status === 'APROVADA' ? '5px solid #6B8E23' : '5px solid #CD5C5C', backgroundColor: '#FAFAFA', margin: '8px 0', borderRadius: '2px', fontSize: '14px' })
            };

            return (
                <div style={estilos.container}>
                    <div style={estilos.header}>
                        <h2 style={{ margin: '0 0 5px 0' }}>Transaction Settlement Orchestrator</h2>
                        <p style={{ color: '#8C8275', margin: 0 }}>Painel Corporativo de Conciliação e Monitoramento de Risco</p>
                    </div>

                    {/* DASHBOARD DE MÉTRICAS EXECUTIVAS */}
                    <div style={{ ...estilos.grid, marginBottom: '30px' }}>
                        <div style={estilos.cardMetric}>
                            <h4 style={{ color: '#8C8275', margin: '0 0 10px 0' }}>Faturamento Liquidado</h4>
                            <h2 style={{ color: '#4A5D4E', margin: 0 }}>R$ {faturamentoTotal.toFixed(2)}</h2>
                        </div>
                        <div style={estilos.cardMetric}>
                            <h4 style={{ color: '#8C8275', margin: '0 0 10px 0' }}>Transações Aprovadas</h4>
                            <h2 style={{ color: '#6B8E23', margin: 0 }}>{transacoesAprovadas}</h2>
                        </div>
                        <div style={estilos.cardMetric}>
                            <h4 style={{ color: '#8C8275', margin: '0 0 10px 0' }}>Fraudes / Impedimentos</h4>
                            <h2 style={{ color: '#CD5C5C', margin: 0 }}>{fraudesBloqueadas}</h2>
                        </div>
                    </div>

                    <div style={estilos.grid}>
                        {/* FORMULÁRIO DE ENTRADA DO CLIENTE */}
                        <div style={estilos.secao}>
                            <h3 style={{ marginTop: 0, color: '#2C2A29' }}>Simular Operação de Venda</h3>
                            <form onSubmit={dispararTransacao}>
                                <label>CPF do Cliente:</label>
                                <input type="text" value={cpf} onChange={(e) => setCpf(e.target.value)} placeholder="Digite o CPF (ex: 12345678901)" style={estilos.input} />

                                <label>Valor da Venda (R$):</label>
                                <input type="number" step="0.01" value={valor} onChange={(e) => setValor(e.target.value)} placeholder="0.00" style={estilos.input} />

                                <label>Canal de Liquidação:</label>
                                <select value={tipo} onChange={(e) => setTipo(e.target.value)} style={estilos.input}>
                                    <option value="PIX">PIX (Liquidação Instantânea)</option>
                                    <option value="TED">TED (Transferência Eletrônica Disponível)</option>
                                </select>

                                <button type="submit" style={estilos.botao}>Disparar para Liquidação</button>
                            </form>
                        </div>

                        {/* AUDITORIA DE LOGS EM TEMPO REAL */}
                        <div style={estilos.secao}>
